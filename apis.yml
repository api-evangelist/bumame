name: Bumame
description: Bumame is an Indonesian healthcare provider ("Elevating Indonesian Healthcare") delivering global-standard
  health screening and preventive-care services to Indonesian families. It operates a network of clinics and offers
  medical check-up packages, laboratory testing, vaccination and boosters, maternal and child health services, early
  cancer screening and genetic DNA testing, vitamin infusions, home care, doctor consultations, and corporate health
  programs, with online appointment booking. Backed by 500 Global. Surfaced as a portfolio-company lead in the API
  Evangelist network; no public developer API surface has been found to date.
